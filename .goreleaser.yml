version: 2

project_name: journal-cli

builds:
  - main: .
    binary: journal
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/FacileStudio/journal-cli/cmd.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

brews:
  - name: journal
    homepage: https://github.com/FacileStudio/journal-cli
    description: Terminal client for Journal, the suite's centralized logging service
    directory: Formula
    repository:
      owner: FacileStudio
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    install: |
      bin.install "journal"
    test: |
      system "#{bin}/journal", "--version"
